# Ancient Antiquity - nginx site for a plain Ubuntu VM (no Docker).
#   sudo cp deploy/nginx/ancient-antiquity.conf /etc/nginx/sites-available/ancient-antiquity
#   sudo sed -i 's/tickets.example.in/YOUR-DOMAIN/g' /etc/nginx/sites-available/ancient-antiquity
#   sudo ln -s /etc/nginx/sites-available/ancient-antiquity /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   Get the certificate FIRST (this file references it), while the stock "default" site still serves /var/www/html:
#     sudo certbot certonly --webroot -w /var/www/html -d tickets.example.in --deploy-hook "systemctl reload nginx"
#   sudo nginx -t && sudo systemctl reload nginx
# Renewal: the certbot package's systemd timer renews through the same webroot (served by the port-80 block below)
# and runs the deploy hook to reload nginx.
#
# Layout assumed (see DEPLOY.md, part B):
#   /srv/ancient-antiquity/backend          Django project (gunicorn on 127.0.0.1:8000, systemd unit)
#   /srv/ancient-antiquity/frontend/dist    `npm run build` output
#   /srv/ancient-antiquity/media            uploaded place photos (MEDIA_ROOT)

upstream ancient_antiquity_api {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

map $uri $aa_cache_control {
    default                 "";
    ~^/assets/              "public, max-age=31536000, immutable";
    /index.html             "no-cache";
    /sw.js                  "no-cache";
    ~\.(?:svg|png|jpe?g|webp|ico|woff2?)$  "public, max-age=604800";
}

server {
    listen 80;
    listen [::]:80;
    server_name tickets.example.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1 (Ubuntu 22.04): remove this line and use "listen 443 ssl http2;"
    server_name tickets.example.in;

    ssl_certificate     /etc/letsencrypt/live/tickets.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tickets.example.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/ancient-antiquity/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;

    access_log /var/log/nginx/ancient-antiquity.access.log;
    error_log  /var/log/nginx/ancient-antiquity.error.log warn;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cache-Control $aa_cache_control;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    location /api/          { proxy_pass http://ancient_antiquity_api; }
    location /django-admin/ { proxy_pass http://ancient_antiquity_api; }

    # Django admin CSS/JS: served directly from `collectstatic` output (WhiteNoise would also work)
    location /static/ {
        alias /srv/ancient-antiquity/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        alias /srv/ancient-antiquity/media/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
