<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Ancient Antiquity{% endblock %}</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#1e293b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
  <tr><td style="background:#0277bd;padding:18px 24px;color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:.5px;">
    Ancient Antiquity <span style="font-weight:normal;font-size:13px;opacity:.85;">&middot; India's heritage, booked simply</span>
  </td></tr>
  <tr><td style="padding:24px;">
    {% block content %}{% endblock %}
  </td></tr>
  <tr><td style="background:#f8fafc;padding:16px 24px;font-size:12px;color:#64748b;border-top:1px solid #e2e8f0;">
    Need help? Write to <a href="mailto:{{ support_email }}" style="color:#0277bd;">{{ support_email }}</a>{% if support_phone %} or call {{ support_phone }}{% endif %}.<br>
    <a href="{{ frontend_url }}" style="color:#0277bd;">{{ frontend_url }}</a>
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
