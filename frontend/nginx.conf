# Ancient Antiquity - nginx inside the "frontend" container (plain HTTP on port 80).
# Serves the React build, proxies the API/admin to the Django container and serves uploaded media.
# HTTPS: either put a TLS terminator in front of this (cloud load balancer, host nginx, Cloudflare) or
# mount ../deploy/docker/nginx-ssl.conf over this file - see DEPLOY.md.
# This file is included inside the `http {}` block of the stock nginx.conf.

# Cache-Control per path (empty value = header not added, e.g. API responses keep Django's own headers).
map $uri $aa_cache_control {
    default                 "";
    ~^/assets/              "public, max-age=31536000, immutable";
    /index.html             "no-cache";
    /sw.js                  "no-cache";
    ~\.(?:svg|png|jpe?g|webp|ico|woff2?)$  "public, max-age=604800";
}

# Keep the original scheme when an outer TLS proxy already set X-Forwarded-Proto.
map $http_x_forwarded_proto $aa_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # Docker's internal DNS: re-resolve "backend" so a recreated API container doesn't cause 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $aa_backend http://backend:8000;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml;

    # Security headers (Django's duplicates are hidden below so each header is sent once).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Camera is needed for QR scanning at the gate (staff), nothing else.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cache-Control $aa_cache_control;
    # Optional CSP - test in Report-Only mode first (Razorpay needs checkout.razorpay.com / api.razorpay.com):
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://lumberjack.razorpay.com" always;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $aa_forwarded_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot, see docker-compose.yml)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Django: REST API, admin site and the admin's static files (served by WhiteNoise)
    location /api/ {
        proxy_pass $aa_backend;
    }
    location /django-admin/ {
        proxy_pass $aa_backend;
    }
    location /static/ {
        proxy_pass $aa_backend;
    }

    # Place photos uploaded by admins (shared volume with the backend, read-only here)
    location /media/ {
        root /srv;  # /media/x.jpg -> /srv/media/x.jpg
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Vite build output: file names contain a content hash -> cache "forever"
    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # Service worker must always be revalidated so updates reach visitors
    location = /sw.js {
        try_files $uri =404;
    }

    # React Router: every unknown path is the single-page app
    location / {
        try_files $uri /index.html;
    }
}
